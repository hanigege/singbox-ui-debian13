# 国内 DNS 本机转发层（dnsmasq）主配置，由安装器托管。
# 真实上游不在这里维护：平台把上游写在 /etc/sing-box/manager/dns-upstreams.conf
# （servers-file），改上游后平台发 SIGHUP 让 dnsmasq 热重读，不用重启任何服务。
port=1053
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
cache-size=0
all-servers
servers-file=/etc/sing-box/manager/dns-upstreams.conf
